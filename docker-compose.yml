version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: juditrack
      POSTGRES_PASSWORD: juditrack
      POSTGRES_DB: juditrack
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    env_file: .env

  worker:
    build: ./backend
    command: sh -c "python init_db.py && celery -A app.tasks.celery_app worker --loglevel=info"
    volumes: ["./backend:/app"]
    depends_on: [postgres, redis]
    env_file: .env

  beat:
    build: ./backend
    command: sh -c "python init_db.py && celery -A app.tasks.celery_app beat --loglevel=info"
    volumes: ["./backend:/app"]
    depends_on: [postgres, redis]
    env_file: .env

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: "http://api:8000"
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
