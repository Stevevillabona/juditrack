# Blueprint de Render — despliegue completo con clics en el navegador.
# Ver guía paso a paso en DESPLIEGUE.md
#
# Después del primer despliegue hay que completar dos variables a mano
# (Render no puede saber la URL de un servicio antes de crearlo):
#   - En el servicio "juditrack-frontend": VITE_API_BASE = URL de "juditrack-api"
#   - En el servicio "juditrack-api": CORS_ORIGINS = URL de "juditrack-frontend"
# Ambas están marcadas como sync: false abajo, así que Render te las pedirá
# vacías al desplegar y las puedes rellenar después desde el dashboard.

databases:
  - name: juditrack-db
    databaseName: juditrack
    plan: free  # ⚠️ se borra a los 30 días si no la subes a un plan pago antes

services:
  - type: keyvalue
    name: juditrack-redis
    plan: free
    ipAllowList: []  # sin acceso externo: solo la usan los otros servicios de este proyecto

  - type: web
    name: juditrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter  # el plan free duerme tras 15 min sin tráfico
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: juditrack-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: juditrack-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # completar con la URL de juditrack-frontend después del primer deploy
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: worker
    name: juditrack-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "python init_db.py && celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1"
    plan: starter  # Playwright/Chromium necesita más memoria de la que da el plan free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: juditrack-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: juditrack-redis
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: worker
    name: juditrack-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "python init_db.py && celery -A app.tasks.celery_app beat --loglevel=info"
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: juditrack-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: juditrack-redis
          property: connectionString

  - type: web
    name: juditrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false  # completar con la URL de juditrack-api después del primer deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
